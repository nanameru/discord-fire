name: Keep Scheduled Workflows Active

on:
  schedule:
    # Public repositories disable scheduled workflows after 60 days without
    # repository activity. Record activity monthly, away from the busy hour.
    - cron: "17 18 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keep-scheduled-workflows-active
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record repository activity
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: 定期Workflow維持記録を更新"
          git push
