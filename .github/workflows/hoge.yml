name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      message:
        description: "Message to trigger hello"
        required: false
        default: ""

jobs:
  integrate-discord-fire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test workflows
        run: npm test

      - name: Say hello when message is こんにちは！
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.message == 'こんにちは！' }}
        run: |
          echo "こんにちは！"
